name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service:
    name: Build + service runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout catsco-agents
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Build (tsc)
        run: npm run build

      # 只跑服务运行时套件（快速、聚焦）。上游完整回归在同步上游时本地执行：
      # node scripts/run-tests.mjs runtime
      - name: Service runtime tests (unit)
        timeout-minutes: 5
        run: npx tsx --test --test-timeout=60000 tests/service-config.test.ts tests/service-agent-package.test.ts tests/service-platform-client.test.ts tests/service-model-client.test.ts tests/service-session-runner.test.ts tests/service-daemon.test.ts
      - name: Service runtime tests (e2e)
        timeout-minutes: 5
        run: npx tsx --test --test-timeout=60000 tests/service-e2e.test.ts
