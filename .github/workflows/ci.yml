name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service:
    name: Build + service runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout catsco-agents
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Build (tsc)
        run: npm run build

      # 只跑服务运行时套件（快速、聚焦）。上游完整回归在同步上游时本地执行：
      # node scripts/run-tests.mjs runtime
      # 注：--test-force-exit 回避 Linux CI 上“测试已全部通过但 tsx 因残留 handle 不退出”
      # 的问题（e2e 后 child/esbuild 句柄；影响：CI 步超时。深挖列为 TODO）。
      - name: Service runtime tests (unit)
        timeout-minutes: 5
        run: npx tsx --test --test-timeout=60000 --test-force-exit tests/service-config.test.ts tests/service-agent-package.test.ts tests/service-platform-client.test.ts tests/service-model-client.test.ts tests/service-session-runner.test.ts tests/service-daemon.test.ts
      - name: Service runtime tests (e2e)
        timeout-minutes: 5
        run: npx tsx --test --test-timeout=60000 --test-force-exit tests/service-e2e.test.ts
      # MCP 工具桥与 run 回执路由器（无网络依赖的纯单测；桥测试此前只在本地跑）。
      - name: MCP bridge & run-receipt tests
        timeout-minutes: 5
        run: npx tsx --test --test-timeout=60000 --test-force-exit tests/catsco-mcp-tool-bridge.test.ts tests/run-receipts.test.ts
